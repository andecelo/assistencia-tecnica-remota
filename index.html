
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistência Técnica Remota</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
    video { width: 90%; max-width: 500px; margin: 10px; border: 2px solid #333; }
    canvas { position: absolute; top: 0; left: 0; }
    #container { position: relative; }
    button { margin: 10px; padding: 10px 20px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Assistência Técnica Remota</h1>
  <div id="container">
    <video id="localVideo" autoplay muted></video>
    <canvas id="drawingCanvas"></canvas>
  </div>
  <button onclick="clearCanvas()">Limpar Marcações</button>

  <script>
    const localVideo = document.getElementById('localVideo');
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');

    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(stream => {
        localVideo.srcObject = stream;
      });

    function resizeCanvas() {
      canvas.width = localVideo.clientWidth;
      canvas.height = localVideo.clientHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    localVideo.addEventListener('loadedmetadata', resizeCanvas);

    let drawing = false;

    canvas.addEventListener('mousedown', e => {
      drawing = true;
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    });

    canvas.addEventListener('mousemove', e => {
      if (drawing) {
        ctx.lineTo(e.offsetX, e.offsetY);
        ctx.strokeStyle = 'red';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    });

    canvas.addEventListener('mouseup', () => drawing = false);
    canvas.addEventListener('mouseout', () => drawing = false);

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  </script>
</body>
</html>
